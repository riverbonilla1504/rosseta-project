[project]
name = "rosetta-backend"
version = "0.1.0"
description = "Rosetta: API Django + motor de evidencia (ver docs/03-arquitectura/03-backend.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4,<6",
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "factory-boy>=3.3.3",
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "story(key): historia de Jira que cubre la prueba, p. ej. ROS-27",
    "fr(ref): requisito funcional de la spec, p. ej. 005:FR-006",
]

[tool.coverage.run]
source = ["apps", "evidence_engine", "config"]
branch = true
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py", "config/settings/dev.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "evidence_engine.*"
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true
no_implicit_reexport = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
